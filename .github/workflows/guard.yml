name: Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, deterministic guards against the mistakes that actually happen.
      - name: Refuse committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::A real .env file is tracked. Only .env.example may be committed."
            exit 1
          fi
          echo "No .env files tracked."

      - name: Refuse tool configuration directories
        run: |
          if git ls-files | grep -Ei '(^|/)\.(claude|cursor|aider)(/|$)'; then
            echo "::error::A tool configuration directory is tracked."
            exit 1
          fi
          echo "No tool configuration directories tracked."

      - name: Refuse committed node_modules
        run: |
          if git ls-files | grep -E '(^|/)node_modules/'; then
            echo "::error::node_modules is tracked. Add it to .gitignore."
            exit 1
          fi
          echo "node_modules is not tracked."

      # Extends the shared guard: the other repositories check for tool
      # directories but not for tool names left behind in source or docs.
      # Worth backporting to the rest of the organisation.
      - name: Refuse tool instruction files
        run: |
          if git ls-files | grep -Ei '(^|/)(AGENTS|CLAUDE|COPILOT|GEMINI)\.md$'; then
            echo "::error::A tool instruction file is tracked."
            exit 1
          fi
          echo "No tool instruction files tracked."

      # Two files are exempt because their job is to name the things being
      # excluded: this workflow, and .gitignore. Everywhere else — source,
      # comments, documentation — the names must not appear.
      - name: Refuse tool name references in tracked files
        run: |
          MATCHES=$(git ls-files \
            | grep -vE '^(\.github/workflows/guard\.yml|\.gitignore)$' \
            | xargs -r grep -lEi 'claude|anthropic|chatgpt|openai|copilot' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tool names found in the following tracked files:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No tool name references in tracked files."

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The verify scripts encode decisions that are easy to undo by accident
      # and impossible to notice afterwards. Running them only on a developer's
      # machine means running them only when someone remembers.
      - run: npm run lint
      - run: npx tsc --noEmit

      # These read source, so they run before anything is built.
      - run: npm run verify:list-privacy
      - run: npm run verify:seo
      - run: npm run verify:dashboard-shell
      - run: npm run i18n:pending

      # No database credentials here on purpose. Public pages must render
      # without them — that is what makes a deploy possible while the database
      # is down, and a build that quietly depends on them would hide it.
      - run: npm run build

      # This one reads the emitted CSS, not the source: the point is what the
      # bundler actually produced, since the font-stack bug it guards against
      # was Turbopack ignoring an option the source clearly set. It therefore
      # has to run after the build, not with the other guards.
      - run: npm run verify:fonts
